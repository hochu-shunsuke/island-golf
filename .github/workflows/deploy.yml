name: Deploy

# main に入ったものを Cloudflare へ出す（stroll と同じ作り）。
#
# 検証（型・ビルド・テスト）を通ったときだけデプロイする。
# Cloudflare 側の GitHub 連携で自動デプロイすると、CI が落ちていても
# 出てしまう（ゲートが無い）。だからデプロイもここで管理する。
# 二重に出さないよう、Cloudflare 側の連携はつながないこと。
on:
  push:
    branches: [main]
  # 手で出したいとき用（再デプロイしたい等）。
  workflow_dispatch:

# 同時に走らせない。後から来た方を待たせて、順番に出す。
# 並行すると、古いビルドが新しいビルドを上書きしうる。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ここが門。落ちれば deploy は動かない。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ci

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # 鍵が無いまま wrangler を動かすと分かりにくい失敗になるので、先に止めて理由を出す。
      - name: Cloudflare の鍵があるか
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 静的ファイルだけを配る Worker。dist/ を組んでから出す（先に組まないと古い画面が出る）。
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
